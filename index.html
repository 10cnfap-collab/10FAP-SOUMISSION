@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1620;--surface:#14212d;--ink:#e2ecf4;--muted:#96a8b8;--line:#26384a;--grid:#1d2c3a;--soft:#163049;--royal:#5db6ec;--banner:#0b6aa4;--banner-deep:#084f7b;
  --c-lectures:#5db6ec;--c-panel:#cfb5f2;--c-workshop:#7fd3dc;--c-symposium:#ddbb78;--c-break:#9aa4b5;--c-ceremony:#a9c6e6;
  --t-lectures:#163049;--t-panel:#2c2140;--t-workshop:#123338;--t-symposium:#3a2f18;--t-break:#1f2836;--t-ceremony:#172a40;
  --crit:#f2b8b5;--crit-soft:#3b1a18;--warn:#f1c66b;--warn-soft:#3a2d10;--ok:#8fd6a3;--ok-soft:#173222;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1620;--surface:#14212d;--ink:#e2ecf4;--muted:#96a8b8;--line:#26384a;--grid:#1d2c3a;--soft:#163049;--royal:#5db6ec;--banner:#0b6aa4;--banner-deep:#084f7b;
  --c-lectures:#5db6ec;--c-panel:#cfb5f2;--c-workshop:#7fd3dc;--c-symposium:#ddbb78;--c-break:#9aa4b5;--c-ceremony:#a9c6e6;
  --t-lectures:#163049;--t-panel:#2c2140;--t-workshop:#123338;--t-symposium:#3a2f18;--t-break:#1f2836;--t-ceremony:#172a40;
  --crit:#f2b8b5;--crit-soft:#3b1a18;--warn:#f1c66b;--warn-soft:#3a2d10;--ok:#8fd6a3;--ok-soft:#173222;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.mast-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;flex:none;background:var(--fap);-webkit-mask:var(--logo-mark) center/contain no-repeat;mask:var(--logo-mark) center/contain no-repeat}
.brand b{font-family:var(--f-display);font-size:16px;font-weight:600}
.brand span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.modes{display:flex;gap:2px}
.modes button{border:0;background:none;color:var(--muted);padding:17px 12px 14px;cursor:pointer;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.modes button[aria-current="true"]{color:var(--royal);border-bottom-color:var(--royal)}
.demo{font-size:12px;background:var(--warn-soft);color:var(--warn);font-weight:500;padding:3px 10px;border-radius:99px}

.wrap{max-width:1440px;margin:18px auto 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px;min-width:0}
.card.head{border-top:10px solid var(--fap);padding-top:18px}
.btn{border:1px solid transparent;border-radius:4px;padding:8px 16px;font-weight:500;cursor:pointer;background:var(--royal);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.subtle{background:transparent;color:var(--royal);padding-inline:8px}
.btn.danger{background:var(--crit);color:#fff}
.btn.gold{background:var(--fap);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.in,.sel,.ta{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%;min-width:0}
.ta{resize:vertical;line-height:1.5}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.01em}
.req{color:var(--crit)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--royal);width:16px;height:16px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.st-brouillon{background:var(--grid);color:var(--muted)} .st-en_preparation{background:var(--soft);color:var(--royal)} .st-a_valider{background:var(--warn-soft);color:var(--warn)}
.st-valide{background:#DDF3F3;color:#006B6B} .st-publie{background:var(--ok-soft);color:var(--ok)} .st-modifie{background:#FFE8CC;color:#9A4A00}
.st-annule{background:var(--crit-soft);color:var(--crit)} .st-archive{background:var(--grid);color:var(--muted);text-decoration:line-through}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-valide{background:#123638;color:#4FD0D0}:root:not([data-theme="light"]) .st-modifie{background:#3D2A12;color:#F2B46B}}
:root[data-theme="dark"] .st-valide{background:#123638;color:#4FD0D0} :root[data-theme="dark"] .st-modifie{background:#3D2A12;color:#F2B46B}
.ty{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.issue-c{color:var(--crit)} .issue-a{color:var(--warn)}
.notice{border-radius:8px;padding:10px 14px;font-size:13.5px}
.notice.crit{background:var(--crit-soft);color:var(--crit)} .notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.info{background:var(--soft)} .notice.ok{background:var(--ok-soft);color:var(--ok)}

/* admin shell */
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.admin{grid-template-columns:1fr}}

<script>
"use strict";
const P = window.PROG;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(m,ms){ $$(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),ms||(m.length>90?7000:3200)); }
const ss={ get(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const fmtDay=(d,o)=>{ const x=new Date(d+"T12:00:00"); return isNaN(x)?d:x.toLocaleDateString("fr-FR",o||{weekday:"long",day:"numeric",month:"long"}); };
const fmtAt=iso=>{ const d=new Date(iso); return isNaN(d)?"":d.toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
const codeTag=(s,lg)=>{ const c=P.codeOf(s||{}); return c?`<span class="code${lg?" lg":""}">${esc(c)}</span>`:""; };
const slotLabel=s=>`${esc(fmtDay(s.day,{weekday:"short",day:"numeric",month:"short"}))} · ${esc(s.start)}–${esc(s.end)} · ${esc(s.allRooms?"Toutes salles":roomName(s.roomId))}`;
const stPill=s=>`<span class="pill st-${esc(s)}">${esc((P.STATUS[s]||{}).label||s)}</span>`;

/* ======================= Données : démo locale ou API Vercel ======================= */
const API_URL=String(window.FAP_PROG_API??"").trim();
const LIVE=!!API_URL;
let api;
if(LIVE){
  const call=async(fn,args,token)=>{ let r; try{ r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fn,args,token})}); }catch(e){ throw new Error("Connexion au serveur impossible. Vérifiez votre connexion."); }
    let j; try{ j=await r.json(); }catch(e){ throw new Error("Réponse du serveur illisible (erreur "+r.status+")."); } if(!j.ok) throw new Error(j.error||"Erreur serveur."); return j.data; };
  api=new Proxy({},{get:(o,fn)=>(...a)=>call(fn,a,S.token)});
}else{
  const K="fapprog_demo_v2:"; const mem={};
  const ls={ get(k){ try{ const v=localStorage.getItem(K+k); return v?JSON.parse(v):(mem[k]??null); }catch(e){ return mem[k]??null; } }, set(k,v){ mem[k]=v; try{ localStorage.setItem(K+k,JSON.stringify(v)); }catch(e){} } };
  const coll=n=>ls.get(n)||{};
  const store={
    getCongress:async()=>ls.get("congress"), setCongress:async c=>ls.set("congress",c),
    sessions:async()=>Object.values(coll("sessions")).map(clone), getSession:async id=>{ const x=coll("sessions")[id]; return x?clone(x):null; },
    putSession:async s=>{ const c=coll("sessions"); c[s.id]=clone(s); ls.set("sessions",c); }, delSession:async id=>{ const c=coll("sessions"); delete c[id]; ls.set("sessions",c); },
    persons:async()=>Object.values(coll("persons")).map(clone), getPerson:async id=>{ const x=coll("persons")[id]; return x?clone(x):null; },
    putPerson:async p=>{ const c=coll("persons"); c[p.id]=clone(p); ls.set("persons",c); }, delPerson:async id=>{ const c=coll("persons"); delete c[id]; ls.set("persons",c); },
    audit:async n=>(ls.get("audit")||[]).slice(0,n), addAudit:async e=>{ const a=ls.get("audit")||[]; a.unshift(e); ls.set("audit",a.slice(0,1000)); },
    nextId:async k=>{ const q=ls.get("seq")||{S:1,P:1}; const id=k+String(q[k]++).padStart(3,"0"); ls.set("seq",q); return id; },
    setSeq:async(s,p)=>ls.set("seq",{S:s,P:p})
  };
  const svc=P.createService(store);
  const actor=()=>S.actor||"Administrateur";
  api={
    getPublic:()=>svc.getPublic(),
    login:async(pw,name)=>{ if(pw!=="fap2026") throw new Error("Mot de passe incorrect."); return {token:"demo",name:name||"Administrateur"}; },
    getState:()=>svc.getState(),
    saveCongress:c=>svc.saveCongress(actor(),c), saveSession:(s,v)=>svc.saveSession(actor(),s,v), importSessions:l=>svc.importSessions(actor(),l),
    deleteSession:id=>svc.deleteSession(actor(),id), setStatus:(id,st)=>svc.setStatus(actor(),id,st), setVisible:(id,v)=>svc.setVisible(actor(),id,v),
    publishMany:ids=>svc.publishMany(actor(),ids), savePerson:p=>svc.savePerson(actor(),p), deletePerson:id=>svc.deletePerson(actor(),id),
    mergePersons:(a,b)=>svc.mergePersons(actor(),a,b), swapSessions:(a,b,v,f)=>svc.swapSessions(actor(),a,b,v,f), renumber:()=>svc.renumber(actor()), seedDemo:()=>svc.seedDemo(actor()), clearProgramme:()=>svc.clearProgramme(actor())
  };
  api._boot=async()=>{ if(!(await store.sessions()).length && !ls.get("seeded")){ await svc.seedDemo("Démonstration"); ls.set("seeded",true); } };
}

/* ======================= État ======================= */
const S={ mode:"public", pub:null, token:null, actor:"", data:null, tab:"builder", day:null, pubView:"grille", pubDay:null, q:"", pubRoom:"", pubTheme:"",
  filt:{status:"",type:"",room:"",theme:"",q:""}, issuesOpen:false, sel:new Set() };
const saved=ss.get("fapprog_auth"); if(saved){ S.token=saved.token; S.actor=saved.name; }
const pmap=()=>{ const m={}; (S.data?.persons||[]).forEach(p=>m[p.id]=p); return m; };
const C=()=>S.data?.congress||S.pub?.congress||P.defaultCongress();

const PVIEWS=[["grille","Par jour"],["salle","Par salle"],["chrono","Chronologique"],["intervenants","Intervenants"],["themes","Par thème"]];
function pubSessions(){ return (S.pub?.sessions||[]).slice().sort((a,b)=>a.day.localeCompare(b.day)||P.toMin(a.start)-P.toMin(b.start)||(a.roomId||"").localeCompare(b.roomId||"")); }
function personsOfSnap(s){ const out=[]; const add=(p,role)=>p&&p.id&&out.push({p,role});
  (s.moderators||[]).forEach(p=>add(p,"Modérateur")); (s.lectures||[]).forEach(l=>add(l.speaker,"Orateur")); (s.panelists||[]).forEach(p=>add(p,"Panéliste"));
  (s.facilitators||[]).forEach(p=>add(p,"Animateur")); (s.instructors||[]).forEach(p=>add(p,"Formateur")); (s.speakers||[]).forEach(p=>add(p,"Intervenant")); if(s.sponsor) add(s.sponsor.speaker,"Orateur (symposium)"); return out; }
function matchQ(s,q){ if(!q) return true; q=q.toLowerCase(); const hay=[s.title,s.subtitle,s.theme,s.description,roomName(s.roomId),s.sponsor&&s.sponsor.company,(s.lectures||[]).map(l=>l.title).join(" "),personsOfSnap(s).map(x=>x.p.name+" "+x.p.institution+" "+(x.p.specialties||"")+" "+x.role).join(" ")].join(" ").toLowerCase(); return hay.includes(q); }
function liveState(s){ const n=P.nowIn(C().timezone); if(s.day!==n.day) return s.day<n.day?"past":""; if(P.toMin(s.end)<=n.min) return "past"; if(P.toMin(s.start)<=n.min) return "now"; return ""; }
function isCongressNow(){ const n=P.nowIn(C().timezone); return C().days.some(d=>d.date===n.day); }

  const range=d0?(fmtDay(d0.date,{day:"numeric"})+(dN!==d0?"–"+fmtDay(dN.date,{day:"numeric",month:"long",year:"numeric"}):fmtDay(d0.date,{month:"long",year:"numeric"}))):"";

      <div class="meta"><span>${esc(range)}</span><span>${esc(c.venue)}, ${esc(c.city)}</span><span>${c.rooms.length} salles en parallèle</span>${isCongressNow()?`<span class="livepill">En direct</span>`:""}</div></div></section>

    ${legend()}

    <p class="tiny muted">Heures de ${esc(c.city)} (${esc(c.timezone)}). Programme susceptible d'évoluer. Dernière mise à jour : ${esc(fmtAt(S.pub.generatedAt))}.</p></div>`;

const legend=()=>`<div class="legend">${["lectures","panel","workshop","symposium","ceremony","break"].map(k=>`<span><i style="background:var(--c-${k})"></i>${esc(P.TYPES[k].label)}</span>`).join("")}</div>`;

function pubDir(){ const m={}; pubSessions().forEach(s=>personsOfSnap(s).forEach(({p,role})=>{ (m[p.id]=m[p.id]||{p,items:[]}).items.push({s,role}); }));

    return `<button class="pitem k-${s.type} ${L}" data-act="psession" data-v="${esc(s.id)}"><div><div class="tm">${esc(s.start)}–${esc(s.end)}</div>${s.code?`<div class="code" style="display:inline-block;margin-top:4px">${esc(s.code)}</div>`:""}${showRoom?`<div class="small muted">${esc(s.allRooms?"Toutes salles":roomName(s.roomId))}</div>`:""}${L==="now"?`<span class="livepill" style="margin-top:6px">En cours</span>`:""}</div>

      ${ppl.length?`<div class="small muted">${esc(ppl.join(" · "))}</div>`:""}${s.sponsor?`<div class="small"><b>${esc(s.sponsor.company)}</b></div>`:""}</div></button>`; }).join("")}</div>`; }
function pubSessionModal(id){ const s=(S.pub.sessions||[]).find(x=>x.id===id); if(!s) return; modal(snapCard(s)+`<div class="row"><span class="spacer"></span><button class="btn ghost" data-act="close">Fermer</button></div>`); }

    ${s.sponsor?`<h4 class="eyebrow" style="margin-top:12px">Sponsor</h4><div class="spk"><b>${esc(s.sponsor.company)}</b>${s.sponsor.presentationTitle?`<span>${esc(s.sponsor.presentationTitle)}</span>`:""}${s.sponsor.speaker?`<span class="small muted">${esc(s.sponsor.speaker.name)}</span>`:""}</div>`:""}

}

/* ======================= Grille horaire (commune) ======================= */
function timeGrid(o){
  const c=o.mode==="public"?S.pub.congress:C();
  const t0=P.toMin(c.dayStart||"08:30"), t1=P.toMin(c.dayEnd||"20:30"), H=(t1-t0);
  const y=m=>`calc(var(--ppm) * ${m-t0})`, h=m=>`calc(var(--ppm) * ${m})`;
  const times=[]; for(let m=Math.ceil((t0+1)/30)*30;m<t1;m+=30) times.push(m);
  const bands=o.sessions.filter(s=>s.allRooms).map(s=>`<div class="band" data-act="${o.mode==="public"?"psession":"edit"}" data-v="${esc(s.id)}" style="top:${y(P.toMin(s.start))};height:calc(${h(P.toMin(s.end)-P.toMin(s.start))} - 2px);left:4px;width:calc(${o.rooms.length*100}% - 8px)">${esc(s.title||"Pause")} · <span class="mono">${esc(s.start)}–${esc(s.end)}</span>${o.mode==="admin"&&!s.visible?" · masqué":""}</div>`).join("");
  const cols=o.rooms.map((r,ri)=>{
    const closed=(o.blocks||[]).filter(b=>b.day===o.day&&b.rooms.includes(r.id)).map(b=>`<div class="blk-closed" style="top:${y(P.toMin(b.from))};height:${h(P.toMin(b.to)-P.toMin(b.from))}">Salle fermée<br>${esc(b.label)}</div>`).join("");
    const ev=o.sessions.filter(s=>!s.allRooms&&s.roomId===r.id).map(s=>evBlock(s,o.mode,y,h)).join("");
    return `<div class="tg-col" data-room="${r.id}" style="height:calc(var(--ppm) * ${H})">${closed}${ev}${ri===0?bands:""}</div>`;
  }).join("");
  return `<div class="gridwrap" id="gw"><div class="tg" style="--cols:${o.rooms.length}" data-day="${o.day}" data-t0="${t0}" data-t1="${t1}">
    <div class="tg-corner"></div>${o.rooms.map(r=>`<div class="tg-head ${r.main?"main":""}">${esc(r.name)}<small>${r.main?"Salle principale":"Session parallèle"}</small></div>`).join("")}
    <div class="tg-times" style="height:calc(var(--ppm) * ${H});position:sticky">${times.map(m=>`<span style="top:${y(m)}">${P.fromMin(m)}</span>`).join("")}</div>${cols}
    <div class="nowline" id="nowline" hidden></div></div></div>`;
}
function evBlock(s,mode,y,h){
  const D=P.dur(s), short=D<35, c=mode==="admin"?crit(s.id):[], al=mode==="admin"?(BYS[s.id]||[]).filter(i=>i.level==="alerte"):[], L=liveState(s);
  const title=s.title?esc(s.title):`<span class="t missing">Titre manquant</span>`;
  const dim=mode==="admin"&&(S.filt.status&&s.status!==S.filt.status||S.filt.type&&s.type!==S.filt.type);
  const people=mode==="public"?personsOfSnap(s).filter(x=>x.role!=="Modérateur").slice(0,2).map(x=>x.p.name).join(" · "):"";
  return `<div class="ev k-${s.type} ${s.type==="workshop"?"workshop-pat":""} ${short?"short":""} ${c.length?"crit":""} ${dim?"dim":""} ${L}" data-act="${mode==="public"?"psession":"edit"}" data-v="${esc(s.id)}" data-drag="${mode==="admin"?"1":""}"
     style="top:${y(P.toMin(s.start))};height:calc(${h(D)} - 2px)" title="${esc((s.title||"Sans titre")+" · "+s.start+"–"+s.end)}">
    <div class="row" style="gap:6px">${mode==="admin"?codeTag(s):(s.code?`<span class="code">${esc(s.code)}</span>`:"")}<span class="ty">${esc(s.type==="ceremony"?"Cérémonie":P.TYPES[s.type].short)}</span><span class="mono tiny muted">${esc(s.start)}–${esc(s.end)}</span>${mode==="admin"&&!s.visible?`<span class="tiny muted" title="Masqué au public">◌ masqué</span>`:""}</div>
    ${s.title?`<div class="t">${title}</div>`:title}
    ${mode==="public"&&people?`<div class="tiny muted">${esc(people)}</div>`:""}
    ${mode==="admin"?`<div class="meta">${stPill(s.status)}${c.length?`<span class="pill" style="background:var(--crit-soft);color:var(--crit)">⚠ ${c.length}</span>`:al.length?`<span class="pill" style="background:var(--warn-soft);color:var(--warn)">${al.length}</span>`:""}</div><div class="rd"><i style="width:${P.readiness(s)}%"></i></div>`:""}
  </div>`;
}
function placeNow(){
  const nl=$("#nowline"), tg=$(".tg"); if(!nl||!tg) return;
  const n=P.nowIn(C().timezone), t0=+tg.dataset.t0, t1=+tg.dataset.t1;
  if(tg.dataset.day!==n.day||n.min<t0||n.min>t1){ nl.hidden=true; return; }
  const ppm=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ppm"))||1.35;
  const col=$(".tg-col"); nl.hidden=false; nl.style.top=((col?col.offsetTop:44)+(n.min-t0)*ppm)+"px"; nl.dataset.t=P.fromMin(n.min);
}
setInterval(()=>{ if(isCongressNow()) { if(S.mode==="public"&&!$(".scrim")) render(); else placeNow(); } },60000);

function aDash(){
  const A=sessionsActive(), sci=A.filter(s=>["lectures","panel","workshop"].includes(s.type));
  const missSpk=sci.filter(s=>s.type==="lectures"&&(s.lectures||[]).some(l=>!l.speakerId)).length+sci.filter(s=>s.type==="panel"&&!(s.panelists||[]).length).length;
  const missMod=sci.filter(s=>["lectures","panel"].includes(s.type)&&!(s.moderators||[]).length).length;
  const sym=A.filter(s=>s.type==="symposium"), symFree=sym.filter(s=>!s.sponsor||!s.sponsor.company).length;
  const nc=ISSUES.filter(i=>i.level==="critique").length, pub=A.filter(s=>s.snapshot&&s.visible).length;
  const ready=sci.length?Math.round(sci.reduce((t,s)=>t+P.readiness(s),0)/sci.length):0;
  const byRoom=C().rooms.map(r=>({l:r.name,n:sci.filter(s=>s.roomId===r.id).length}));
  const byStatus=Object.keys(P.STATUS).map(k=>({k,l:P.STATUS[k].label,n:sessionsAll().filter(s=>s.status===k).length}));
  const mx=Math.max(1,...byRoom.map(x=>x.n)), ms=Math.max(1,...byStatus.map(x=>x.n));
  const low=sci.slice().sort((a,b)=>P.readiness(a)-P.readiness(b)).slice(0,8);
  return `<div><span class="eyebrow">${esc(C().short)}</span><h1 class="h1">Tableau de bord du programme</h1></div>
   <div class="kpis">
    <div class="kpi"><b>${sci.length}</b><span>Sessions scientifiques</span></div>
    <div class="kpi"><b>${pub}</b><span>Éléments publiés et visibles</span></div>
    <div class="kpi"><b>${A.filter(s=>!s.snapshot).length}</b><span>Non publiés (brouillon à validé)</span></div>

/* Glisser-déposer et création par clic */
function bindGrid(){
  const tg=$(".tg"); if(!tg) return;
  const t0=+tg.dataset.t0, t1=+tg.dataset.t1, ppm=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ppm"))||1.35;
  const minAt=(col,clientY)=>{ const r=col.getBoundingClientRect(); return Math.round((t0+(clientY-r.top)/ppm())/5)*5; };
  $$(".tg-col").forEach(col=>col.addEventListener("click",e=>{
    if(e.target.closest(".ev,.band")) return;
    const m=Math.max(t0,Math.min(t1-20,Math.floor(minAt(col,e.clientY)/10)*10));
    const bl=(C().blocks||[]).find(b=>b.day===S.day&&b.rooms.includes(col.dataset.room)&&m>=P.toMin(b.from)&&m<P.toMin(b.to));
    if(bl){ toast(`${roomName(col.dataset.room)} est fermée de ${bl.from} à ${bl.to} : ${bl.label}.`); return; }
    quickCreate(col.dataset.room,P.fromMin(m));
  }));
  $$(".ev[data-drag='1']").forEach(el=>el.addEventListener("pointerdown",e=>{
    if(e.button!==0) return; const s=sessionsAll().find(x=>x.id===el.dataset.v); if(!s) return;
    const sx=e.clientX, sy=e.clientY, D=P.dur(s), r0=el.getBoundingClientRect(), offY=sy-r0.top; let moved=false, ghost=null, target=null;
    const move=ev=>{ if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return; moved=true; ev.preventDefault();
      el.classList.add("drag"); const col=document.elementsFromPoint(ev.clientX,ev.clientY).find(n=>n.classList&&n.classList.contains("tg-col"));
      $$(".tg-col.drop").forEach(c=>c.classList.remove("drop")); if(!col){ target=null; ghost&&ghost.remove(); ghost=null; return; }
      col.classList.add("drop"); const r=col.getBoundingClientRect(); let st=Math.round((t0+(ev.clientY-offY-r.top)/ppm())/5)*5; st=Math.max(t0,Math.min(t1-D,st));
      target={roomId:col.dataset.room,start:P.fromMin(st),end:P.fromMin(st+D)};
      if(!ghost){ ghost=document.createElement("div"); ghost.className="ghostslot"; } col.appendChild(ghost); ghost.style.top=((st-t0)*ppm())+"px"; ghost.style.height=(D*ppm()-2)+"px";
      el.style.transform=`translate(${ev.clientX-sx}px,${ev.clientY-sy}px)`; };
    const up=async()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
      el.classList.remove("drag"); el.style.transform=""; ghost&&ghost.remove(); $$(".tg-col.drop").forEach(c=>c.classList.remove("drop"));
      if(!moved) return; S.justDragged=Date.now();
      if(!target||(target.roomId===s.roomId&&target.start===s.start)) return;
      await moveSession(s,target); };
    document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
  }));
}
async function moveSession(s,t){
  const cand=Object.assign(clone(s),t);
  const others=sessionsActive().filter(x=>x.id!==s.id);
  const clash=others.find(x=>!x.allRooms&&x.roomId===cand.roomId&&P.overlap(x,cand));
  if(clash){ toast(`Déplacement refusé : ${roomName(cand.roomId)} est déjà occupée par « ${clash.title||"une activité"} » (${clash.start}–${clash.end}).`); return; }
  const bl=(C().blocks||[]).find(b=>b.day===cand.day&&b.rooms.includes(cand.roomId)&&P.toMin(cand.start)<P.toMin(b.to)&&P.toMin(b.from)<P.toMin(cand.end));
  if(bl){ toast(`Déplacement refusé : ${roomName(cand.roomId)} est fermée de ${bl.from} à ${bl.to} (${bl.label}).`); return; }
  try{ const n=await api.saveSession(cand,s.version); replaceSession(n); recompute(); render();
    const pc=crit(n.id).filter(i=>i.code==="personne2"); toast(pc.length?`Déplacé, mais attention : ${pc[0].message}`:`« ${n.title||"Session"} » déplacée : ${roomName(n.roomId)}, ${n.start}–${n.end}${n.status==="modifie"?" · republication nécessaire":""}.`, pc.length?8000:0); }
  catch(e){ toast(e.message); await reload(); }
}

}

    <div style="align-self:end"><label class="chk"><input type="checkbox" id="e-spv"${sp.detailsVisible!==false?" checked":""}> Afficher le sponsor au public</label></div></div>`; }
  if(s.type==="ceremony") body=`<div><label class="lbl" for="e-kind">Type d'événement</label><select class="sel" id="e-kind">${P.CEREMONY_KINDS.map(k=>`<option${s.kind===k?" selected":""}>${esc(k)}</option>`).join("")}</select></div>`+persons("speakers",0,"Intervenants");
  if(s.type==="break") body=`<label class="chk"><input type="checkbox" id="e-all"${s.allRooms?" checked":""}> Pause commune à toutes les salles</label>`;
  const flow=["brouillon","en_preparation","a_valider","valide"];
  layer(`<div class="scrim" data-act="scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Éditeur de session">

     <button class="btn ghost sm" data-act="preview">Aperçu public</button>${s.id&&s.type!=="break"&&!P.INACTIVE.includes(s.status)?`<button class="btn ghost sm" data-act="swap" data-a="${esc(s.id)}">⇄ Échanger avec…</button>`:""}${s.id?`<button class="btn ghost sm" data-act="dup">Dupliquer</button>`:""}<button class="btn ghost sm" data-act="close">Fermer</button></div>
   ${cr.length?`<div class="notice crit"><b>Publication bloquée.</b>${cr.map(i=>`<div>• ${esc(i.message)}</div>`).join("")}</div>`:""}
   ${iss.filter(i=>i.level==="alerte").length?`<div class="notice warn">${iss.filter(i=>i.level==="alerte").map(i=>`<div>• ${esc(i.message)}</div>`).join("")}</div>`:""}
   ${s.status==="modifie"?`<div class="notice info">Le public voit encore la version publiée le ${esc(fmtAt(s.publishedAt))}. Republiez pour diffuser vos modifications.</div>`:""}
   <div class="card stack">
     <div><label class="lbl" for="e-title">${s.type==="panel"?"Titre du panel":s.type==="workshop"?"Titre de l'atelier":s.type==="symposium"?"Titre du symposium":"Titre de la session"} <span class="req">*</span></label><input class="in" id="e-title" value="${esc(s.title)}" style="font-weight:600;font-size:16px"></div>
     ${s.type==="break"?"":`<div class="fgrid"><div><label class="lbl" for="e-sub">Sous-titre</label><input class="in" id="e-sub" value="${esc(s.subtitle)}"></div><div><label class="lbl" for="e-theme">Thème scientifique</label><select class="sel" id="e-theme"><option value="">—</option>${c.themes.map(t=>`<option${s.theme===t?" selected":""}>${esc(t)}</option>`).join("")}</select></div></div>`}
     <div class="fgrid"><div><label class="lbl" for="e-day">Jour</label><select class="sel" id="e-day">${c.days.map(d=>`<option value="${d.date}"${s.day===d.date?" selected":""}>${esc(d.label)} · ${esc(fmtDay(d.date,{day:"numeric",month:"short"}))}</option>`).join("")}</select></div>
       ${s.allRooms?"":`<div><label class="lbl" for="e-room">Salle</label><select class="sel" id="e-room">${c.rooms.map(r=>`<option value="${r.id}"${s.roomId===r.id?" selected":""}>${esc(r.name)}</option>`).join("")}</select></div>`}
       ${P.familyOf(s)?`<div><label class="lbl" for="e-num">N° (${P.familyOf(s)})</label><input class="in mono" type="number" min="1" max="999" id="e-num" value="${+s.num||""}" placeholder="auto"></div>`:""}
       <div><label class="lbl" for="e-start">Début</label><input class="in mono" type="time" step="300" id="e-start" value="${esc(s.start)}"></div><div><label class="lbl" for="e-end">Fin</label><input class="in mono" type="time" step="300" id="e-end" value="${esc(s.end)}"></div></div>
     ${["break"].includes(s.type)?"":`<div><label class="lbl" for="e-desc">${s.type==="panel"?"Description du panel":s.type==="workshop"?"Description de l'atelier":"Description"}</label><textarea class="ta" id="e-desc" rows="2">${esc(s.description)}</textarea></div>`}
   </div>
   <div class="card stack">${body||`<p class="muted small" style="margin:0">Aucun intervenant pour ce format.</p>`}</div>

   <div class="card stack"><div class="row"><b>Publication</b><span class="spacer"></span><span class="small muted">Préparation : <b class="mono">${P.readiness(s)} %</b></span></div>
     <label class="switch"><input type="checkbox" id="e-vis"${s.visible?" checked":""}> Visible au public</label>
     <div class="small muted">Un élément n'apparaît sur le programme public qu'une fois <b>publié</b> et <b>visible</b>. Le masquer le retire immédiatement.</div>
     ${s.id?`<div class="flow" aria-label="Circuit de validation">${flow.map(k=>`<button data-act="status" data-v="${k}" aria-pressed="${s.status===k}">${P.STATUS[k].label}</button>`).join("<span class='muted'>→</span>")}</div>
     <div class="row"><button class="btn gold" data-act="status" data-v="publie"${cr.length||!s.visible?" disabled":""}>${s.snapshot?"Republier":"Publier"}</button>${s.snapshot?`<span class="small ok" style="color:var(--ok)">En ligne depuis le ${esc(fmtAt(s.publishedAt))}${s.publishedBy?" par "+esc(s.publishedBy):""}</span>`:""}

   ${hist.length?`<div class="card"><b>Historique</b>${hist.map(a=>`<div class="small" style="padding:6px 0;border-top:1px solid var(--line);margin-top:6px"><span class="mono tiny muted">${esc(fmtAt(a.at))}</span> · <b>${esc(a.action)}</b> par ${esc(a.by)}${(a.changes||[]).length?` <span class="muted">(${a.changes.map(c=>esc(c.field)).slice(0,5).join(", ")})</span>`:""}</div>`).join("")}</div>`:""}
   <div class="row" style="position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 20px));background:var(--bg);padding-block:12px"><button class="btn" data-act="save">${isNew?"Créer la session":"Enregistrer"}</button><span class="small muted" id="e-dirty"></span></div>
  </aside></div>`);
  bindEditor();

function readEditor(){
  const s=ED.s, v=id=>{ const e=$("#"+id); return e?e.value:undefined; };
  ["title:e-title","subtitle:e-sub","theme:e-theme","day:e-day","roomId:e-room","start:e-start","end:e-end","description:e-desc","notes:e-notes","objectives:e-obj","audience:e-aud","capacity:e-cap","logistics:e-log","kind:e-kind"].forEach(x=>{ const [k,id]=x.split(":"); const val=v(id); if(val!==undefined) s[k]=val; });
  if($("#e-vis")) s.visible=$("#e-vis").checked; if($("#e-reg")) s.registration=$("#e-reg").checked; if($("#e-all")) s.allRooms=$("#e-all").checked;
  if($("#e-disc")) s.discussion=+$("#e-disc").value||0;
  if($("#e-num")) s.num=parseInt($("#e-num").value,10)||0;
  $$("[data-l]").forEach(el=>{ const l=s.lectures[+el.dataset.l]; if(!l) return; const k=el.dataset.k; l[k]=el.type==="checkbox"?el.checked:k==="duration"?(+el.value||0):el.value; });
  if(s.type==="symposium"){ s.sponsor=Object.assign(s.sponsor||{},{company:v("e-co")||"",commercial:v("e-com")||"disponible",presentationTitle:v("e-pt")||"",logo:v("e-logo")||"",detailsVisible:$("#e-spv").checked}); }
  return s;
}
function bindEditor(){
  const mark=()=>{ readEditor(); const d=$("#e-dirty"); if(d) d.textContent=JSON.stringify(ED.s)!==ED.orig?"Modifications non enregistrées":""; };
  const all=$("#e-all"); if(all) all.addEventListener("change",()=>{ readEditor(); if(!ED.s.allRooms&&!ED.s.roomId) ED.s.roomId=C().rooms[0].id; if(ED.s.allRooms) ED.s.roomId=null; redrawEditorKeepScroll(); });
  $$(".drawer input,.drawer select,.drawer textarea").forEach(el=>{ if(!el.closest(".pick")) el.addEventListener("input",mark); el.addEventListener("change",mark); });
  bindPickers();
}
async function saveEditor(quiet){
  const s=readEditor();
  if(!String(s.title||"").trim()){ toast("Le titre est obligatoire."); $("#e-title")?.focus(); return null; }
  if(!(P.toMin(s.end)>P.toMin(s.start))){ toast("L'heure de fin doit suivre l'heure de début."); return null; }
  try{ const n=await api.saveSession(s,s.id?s.version:null); replaceSession(n); recompute(); await refreshAudit(); ED={s:clone(n),orig:JSON.stringify(n)}; if(!quiet) toast(n.status==="modifie"?"Enregistré. Le public voit encore l'ancienne version : republiez pour diffuser.":"Session enregistrée."); return n; }
  catch(e){ toast(e.message); return null; }
}

/* ---- Sélecteur de personnes ---- */
function picker(field,ids,max){
  const pm=pmap(), busy=ED&&ED.s.id?new Set(ISSUES.filter(i=>i.sessionId===ED.s.id&&i.code==="personne2").map(i=>i.message.split(" (")[0])):new Set();
  return `<div class="chips" data-picker="${esc(field)}" data-max="${max||0}">${ids.map(id=>{ const p=pm[id]; const n=P.displayName(p)||"Fiche supprimée"; return `<span class="chip ${busy.has(n)?"warn":""}" title="${esc(p?p.institution||"":"")}">${esc(n)}${busy.has(n)?" ⚠":""}<button data-act="unpick" data-f="${esc(field)}" data-v="${esc(id)}" aria-label="Retirer">×</button></span>`; }).join("")}
    ${!max||ids.length<max?`<div class="pick"><input class="in" placeholder="Rechercher ou créer une personne…" data-pick="${esc(field)}" autocomplete="off"><div class="pick-list" hidden></div></div>`:""}</div>`;
}
function getIds(f){ const s=ED.s; if(f.startsWith("lec:")){ const l=s.lectures[+f.slice(4)]; return l.speakerId?[l.speakerId]:[]; } if(f==="sponsor") return s.sponsor&&s.sponsor.speakerId?[s.sponsor.speakerId]:[]; return s[f]||[]; }
function setIds(f,ids){ const s=ED.s; if(f.startsWith("lec:")) s.lectures[+f.slice(4)].speakerId=ids[0]||""; else if(f==="sponsor") s.sponsor.speakerId=ids[0]||""; else s[f]=ids; }
function bindPickers(){
  $$("[data-pick]").forEach(inp=>{
    const box=inp.nextElementSibling, f=inp.dataset.pick;
    const show=()=>{ const q=inp.value.trim().toLowerCase(), cur=getIds(f);
      const L=(S.data.persons||[]).filter(p=>!cur.includes(p.id)&&(!q||(P.displayName(p)+" "+p.institution+" "+p.email).toLowerCase().includes(q))).slice(0,8);
      box.innerHTML=L.map(p=>`<button type="button" data-act="pickp" data-f="${esc(f)}" data-v="${esc(p.id)}"><b>${esc(P.displayName(p))}</b> <span class="muted small">${esc(p.institution||"")}</span></button>`).join("")+`<button type="button" data-act="newp" data-f="${esc(f)}" data-q="${esc(inp.value)}" style="color:var(--royal)">+ Créer « ${esc(inp.value||"nouvelle personne")} »</button>`;
      box.hidden=false; };
    inp.addEventListener("focus",show); inp.addEventListener("input",show);
    inp.addEventListener("blur",()=>setTimeout(()=>box.hidden=true,180));
  });
}
function redrawEditorKeepScroll(){ const d=$(".drawer"), y=d?d.scrollTop:0; readEditor(); drawEditor(); const n=$(".drawer"); if(n) n.scrollTop=y; }

/* ---- Échange de contenu entre deux sessions ---- */
function swapModal(idA,idB){
  const A=sessionsAll().find(s=>s.id===idA); if(!A) return;
  const cands=P.chronoSort(sessionsActive().filter(s=>s.id!==A.id&&s.type!=="break"),C());
  modal(`<div class="card stack"><span class="eyebrow">Échange de contenu</span><h3 style="font-size:19px">Échanger ${codeTag(A,true)} avec une autre session</h3>
    <p class="small muted" style="margin:0">Les créneaux (numéro, jour, heure, salle) restent en place. Le contenu est interverti : titre, format, intervenants, conférences, thème, notes.</p>
    <div><label class="lbl" for="sw-b">Session à échanger</label><select class="sel" id="sw-b"><option value="">Choisir une session…</option>${cands.map(s=>`<option value="${esc(s.id)}"${s.id===idB?" selected":""}>${esc(P.codeOf(s)||"—")} · ${esc(fmtDay(s.day,{day:"2-digit",month:"2-digit"}))} ${esc(s.start)} · ${esc(roomName(s.roomId))} — ${esc((s.title||"Sans titre").slice(0,70))}</option>`).join("")}</select></div>
    <div id="sw-prev"></div></div>`);
  const show=()=>{ const b=$("#sw-b").value, out=$("#sw-prev"); if(!b){ out.innerHTML=""; return; }
    let r; try{ r=P.swapCheck(S.data,A.id,b); }catch(e){ out.innerHTML=`<div class="notice crit">${esc(e.message)}</div>`; return; }
    const B=sessionsAll().find(s=>s.id===b);
    const slot=(orig,next)=>`<div class="slot"><div class="row" style="gap:6px">${codeTag(orig,true)}<span class="small muted">${slotLabel(orig)}</span></div>
      <div class="small muted" style="margin-top:8px">Avant</div><div style="text-decoration:line-through;color:var(--muted)">${esc(orig.title||"Sans titre")}</div>
      <div class="small muted" style="margin-top:6px">Après l'échange</div><div><b>${esc(next.title||"Sans titre")}</b> <span class="small muted">(${esc(P.TYPES[next.type].label)})</span></div>
      <div style="margin-top:6px">${stPill(next.status)}${orig.snapshot?` <span class="small muted">Le public voit l'ancienne version jusqu'à la republication.</span>`:""}</div></div>`;
    const durA=P.dur(A), durB=P.dur(B);
    out.innerHTML=`<div class="swapgrid">${slot(A,r.a)}<div class="arrow" aria-hidden="true">⇄</div>${slot(B,r.b)}</div>
      ${durA!==durB?`<div class="notice warn">Les deux créneaux n'ont pas la même durée (${durA} min et ${durB} min). Vérifiez la répartition des conférences après l'échange.</div>`:""}
      <div class="notice ${r.newCrit.length?"crit":"ok"}"><b>Contrôle des chevauchements :</b> ${r.newCrit.length?`${r.newCrit.length} nouveau(x) conflit(s) critique(s)`:"aucun nouveau conflit"}${r.newCrit.map(i=>{ const s=sessionsAll().find(x=>x.id===i.sessionId)||{}; return `<div>• ${codeTag(s)} ${esc(i.message)}</div>`; }).join("")}</div>
      ${r.newWarn.length?`<div class="notice warn">${r.newWarn.map(i=>`<div>• ${esc(i.message)}</div>`).join("")}</div>`:""}
      ${r.solved.length?`<div class="notice ok">Conflits résolus par l'échange :${r.solved.map(i=>`<div>• ${esc(i.message)}</div>`).join("")}</div>`:""}
      <div class="row">${r.newCrit.length?`<button class="btn danger" data-act="doswap" data-a="${esc(A.id)}" data-b="${esc(B.id)}" data-force="1">Échanger quand même</button><span class="small muted">La publication restera bloquée tant que les conflits ne sont pas résolus.</span>`
        :`<button class="btn" data-act="doswap" data-a="${esc(A.id)}" data-b="${esc(B.id)}">⇄ Échanger ${esc(P.codeOf(A)||"")} et ${esc(P.codeOf(B)||"")}</button>`}<span class="spacer"></span><button class="btn ghost" data-act="close">Annuler</button></div>`; };
  $("#sw-b").addEventListener("change",show); show();
}

/* ======================= Couches (tiroir, modale) ======================= */
function layer(html){ $("#layer").innerHTML=html; }
function modal(html,stacked){
  const el=document.createElement("div"); el.className="scrim"+(stacked?" stacked":""); el.dataset.act="scrim"; el.style.justifyContent="center"; el.style.zIndex=stacked?60:40;
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  if(!stacked) $("#layer").innerHTML=""; $("#layer").appendChild(el); setTimeout(()=>{ const f=el.querySelector("input,button"); f&&f.focus(); },20);
}
function closeModal(){ const m=$$("#layer .scrim.stacked"); if(m.length) m[m.length-1].remove(); else closeAll(); }
function closeAll(){ if(ED&&$(".drawer")){ readEditor(); if(JSON.stringify(ED.s)!==ED.orig&&!closeAll.confirm){ closeAll.confirm=true; toast("Modifications non enregistrées : cliquez à nouveau sur Fermer pour les abandonner."); setTimeout(()=>closeAll.confirm=false,4000); return; } }
  closeAll.confirm=false; $("#layer").innerHTML=""; ED=null; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#layer").innerHTML){ $("#layer .scrim.stacked")?closeModal():closeAll(); } });

async function refreshAudit(){ try{ const st=await api.getState(); S.data.audit=st.audit; }catch(e){} }
async function reload(){ try{ S.data=await api.getState(); recompute(); }catch(e){ if(/Session expirée|Connexion requise/.test(e.message)){ S.token=null; ss.set("fapprog_auth",null); } toast(e.message); } render(); }

/* ======================= Export Excel (CSV) ======================= */
function exportCSV(){
  const pm=pmap(), cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"', rows=[["N°","Jour","Début","Fin","Salle","Format","Titre","Thème","Statut","Visible","Modérateurs","Intervenants","Conférences","Sponsor","Préparation %"].map(cell).join(";")];
  sessionsAll().slice().sort((a,b)=>a.day.localeCompare(b.day)||P.toMin(a.start)-P.toMin(b.start)).forEach(s=>rows.push([P.codeOf(s),s.day,s.start,s.end,s.allRooms?"Toutes salles":roomName(s.roomId),P.TYPES[s.type].label,s.title,s.theme,P.STATUS[s.status].label,s.visible?"Oui":"Non",
    (s.moderators||[]).map(id=>P.displayName(pm[id])).join(", "),P.peopleOf(s).filter(x=>x.role!=="Modérateur").map(x=>P.displayName(pm[x.id])+" ("+x.role+")").join(", "),(s.lectures||[]).map((l,i)=>(i+1)+". "+l.title).join(" | "),s.sponsor?s.sponsor.company:"",P.readiness(s)].map(cell).join(";")));
  const blob=new Blob(["﻿"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"}), name="programme-"+(C().id||"congres")+"-"+new Date().toISOString().slice(0,10)+".csv";
  (async()=>{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
    if(dl){ try{ await dl.save({filename:name,data:blob}); toast(sessionsAll().length+" activités exportées."); }catch(e){ if(e&&e.code!=="declined") toast("Export impossible dans cette vue."); } return; }
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
    toast(sessionsAll().length+" activités exportées.");
  })();
}

/* ======================= Actions ======================= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  if(e.target.closest("[data-stop]")&&t.tagName==="TR") return;
  const a=t.dataset.act, v=t.dataset.v;
  if(a==="scrim"){ if(e.target===t) (t.classList.contains("stacked")?closeModal():closeAll()); return; }
  if(a==="ev"||a==="psession"){ if(S.mode==="public") pubSessionModal(v); return; }
  switch(a){
    case "mode": S.mode=v; try{ history.replaceState(null,"","#"+(v==="admin"?"admin":"programme")); }catch(_){}
      if(v==="public") await loadPublic(); else if(S.token&&!S.data) await reload(); render(); window.scrollTo(0,0); break;
    case "pview": S.pubView=v; render(); break;
    case "pday": S.pubDay=v; render(); break;
    case "proom": S.pubRoom=v; render(); break;
    case "ptheme": S.pubTheme=v; render(); break;
    case "pperson": pubPersonModal(v); break;
    case "close": closeAll(); break;
    case "closemodal": closeModal(); break;
    case "login": { const name=$("#lg-name").value.trim(), pw=$("#lg-pw").value; if(!name){ $("#lg-err").innerHTML=`<div class="notice crit">Indiquez votre nom : il apparaîtra dans le journal des modifications.</div>`; return; }
      try{ const r=await api.login(pw,name); S.token=r.token; S.actor=r.name; ss.set("fapprog_auth",{token:r.token,name:r.name}); await reload(); }catch(err){ $("#lg-err").innerHTML=`<div class="notice crit">${esc(err.message)}</div>`; } break; }
    case "logout": S.token=null; S.data=null; ss.set("fapprog_auth",null); render(); break;
    case "tab": S.tab=v; render(); window.scrollTo(0,0); break;
    case "day": S.day=v; render(); break;
    case "issues": S.issuesOpen=!S.issuesOpen; render(); break;
    case "edit": if(Date.now()-(S.justDragged||0)<400) return; closeAll(); openEditor(v); break;
    case "create": { closeAll(); const st=t.dataset.start, d=+t.dataset.d; const s=P.blankSession(t.dataset.type,S.day,t.dataset.type==="break"?null:t.dataset.room,st,P.fromMin(P.toMin(st)+d));
      if(t.dataset.type==="break") s.title="Pause-café"; openEditor(null,s); setTimeout(()=>$("#e-title")?.focus(),30); break; }
    case "gentemplate": { const L=P.templateSessions(C(),S.day); try{ await api.importSessions(L); await reload(); toast(L.length+" créneaux créés pour ce jour."); }catch(err){ toast(err.message); } break; }
    case "publishday": { const ids=sessionsActive().filter(s=>s.day===S.day&&s.status==="valide"&&s.visible&&!crit(s.id).length).map(s=>s.id);
      try{ const r=await api.publishMany(ids); await reload(); const ko=r.filter(x=>!x.ok); toast(`${r.length-ko.length} session(s) publiée(s)${ko.length?` · ${ko.length} refusée(s) : ${ko[0].error}`:""}.`); }catch(err){ toast(err.message); } break; }
    case "exportcsv": exportCSV(); break;
    /* éditeur */
    case "save": { const n=await saveEditor(); if(n){ render(); drawEditor(); } break; }
    case "status": { let s=ED.s; if(!s.id) return; readEditor(); if(JSON.stringify(ED.s)!==ED.orig){ s=await saveEditor(true); if(!s) return; }
      try{ const r=await api.setStatus(s.id,v); if(r.ok===false){ toast("Publication refusée : "+r.error,9000); return; } replaceSession(r.session); recompute(); await refreshAudit(); ED={s:clone(r.session),orig:JSON.stringify(r.session)}; render(); drawEditor();
        toast(v==="publie"?"Publié : visible sur le programme public.":"Statut : "+P.STATUS[v].label+"."); }catch(err){ toast(err.message); } break; }
    case "delete": { const s=ED.s; if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Confirmer"; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent=s.snapshot||P.LIVE.includes(s.status)?"Archiver":"Supprimer"; } },4000); return; }
      try{ const r=await api.deleteSession(s.id); if(r.deleted) S.data.sessions=S.data.sessions.filter(x=>x.id!==s.id); else replaceSession(r.session); recompute(); await refreshAudit(); ED=null; layer(""); render(); toast(r.deleted?"Session supprimée.":"Session archivée et retirée du public."); }catch(err){ toast(err.message); } break; }
    case "dup": { readEditor(); const c=clone(ED.s); delete c.snapshot; Object.assign(c,{id:"",num:0,status:"brouillon",version:0,title:(c.title||"")+" (copie)"}); openEditor(null,c); toast("Copie prête : choisissez une salle ou un horaire, puis enregistrez."); break; }
    case "preview": { readEditor(); const snap=P.publicSnapshot(ED.s,S.data.persons||[]); modal(`<div class="notice info">Aperçu exact de ce que verra le public après publication.</div>${snapCard(snap)}<div class="row"><span class="spacer"></span><button class="btn ghost" data-act="closemodal">Fermer l'aperçu</button></div>`,true); break; }
    case "ladd": readEditor(); ED.s.lectures.push({id:"L"+Date.now().toString(36),title:"",speakerId:"",duration:20,abstractRef:"",visible:true}); redrawEditorKeepScroll(); break;
    case "ldel": readEditor(); ED.s.lectures.splice(+t.dataset.i,1); redrawEditorKeepScroll(); break;
    case "lup": case "ldown": { readEditor(); const i=+t.dataset.i, j=a==="lup"?i-1:i+1, L=ED.s.lectures; if(j<0||j>=L.length) return; [L[i],L[j]]=[L[j],L[i]]; redrawEditorKeepScroll(); break; }
    case "pickp": { const f=t.dataset.f; readEditor(); const cur=getIds(f); if(!cur.includes(v)) setIds(f,cur.concat(v)); if(t.dataset.close) closeModal(); redrawEditorKeepScroll(); setTimeout(()=>{ const i=$(`[data-pick="${CSS.escape(f)}"]`); i&&i.focus(); },20); break; }
    case "unpick": { readEditor(); setIds(t.dataset.f,getIds(t.dataset.f).filter(x=>x!==v)); redrawEditorKeepScroll(); break; }
    case "newp": readEditor(); personModal(null,t.dataset.f,t.dataset.q); break;

    case "saveperson": await savePersonFromModal(v||"",t.dataset.f||""); break;
    case "applysg": { const el=$("#p-"+t.dataset.k); el.value=t.dataset.v; el.dispatchEvent(new Event("input")); break; }
    case "delperson": try{ await api.deletePerson(v); S.data.persons=S.data.persons.filter(p=>p.id!==v); closeAll(); render(); toast("Fiche supprimée."); }catch(err){ toast(err.message); } break;
    case "merge": { const pm=pmap(), A=pm[t.dataset.a], B=pm[t.dataset.b];
      modal(`<div class="card stack"><span class="eyebrow">Fusion de fiches</span><p style="margin:0">Choisissez la fiche à conserver. Toutes les affectations de l'autre fiche lui seront transférées, puis l'autre fiche sera supprimée.</p>
        ${[A,B].map(p=>`<label class="chk card" style="padding:12px"><input type="radio" name="keep" value="${esc(p.id)}"${p===A?" checked":""}><span><b>${esc(P.displayName(p))}</b><br><span class="small muted">${esc(p.institution||"—")} · ${esc(p.email||"sans e-mail")}</span></span></label>`).join("")}
        <div class="row"><button class="btn" data-act="domerge" data-a="${esc(A.id)}" data-b="${esc(B.id)}">Fusionner</button><span class="spacer"></span><button class="btn ghost" data-act="close">Annuler</button></div></div>`); break; }
    case "domerge": { const keep=$("input[name=keep]:checked").value, drop=keep===t.dataset.a?t.dataset.b:t.dataset.a; try{ await api.mergePersons(keep,drop); closeAll(); await reload(); toast("Fiches fusionnées."); }catch(err){ toast(err.message); } break; }
    /* liste */
    case "selclear": S.sel.clear(); render(); break;
    case "swap": { if(ED&&$(".drawer")){ readEditor(); if(JSON.stringify(ED.s)!==ED.orig){ const n=await saveEditor(true); if(!n) return; } } const a=t.dataset.a, b=t.dataset.b||""; ED=null; layer(""); swapModal(a,b); break; }
    case "doswap": { const A=sessionsAll().find(s=>s.id===t.dataset.a), B=sessionsAll().find(s=>s.id===t.dataset.b); t.disabled=true;
      try{ const r=await api.swapSessions(A.id,B.id,[A.version,B.version],!!t.dataset.force);
        if(r.ok===false){ toast("Échange non effectué : "+(r.conflicts||[]).map(c=>c.message)[0],9000); t.disabled=false; return; }
        closeAll(); S.sel.clear(); await reload(); toast(`${P.codeOf(A)||"Session"} ⇄ ${P.codeOf(B)||"session"} : contenus échangés${r.conflicts&&r.conflicts.length?` · ${r.conflicts.length} conflit(s) à résoudre`:""}.`, r.conflicts&&r.conflicts.length?8000:0); }
      catch(err){ toast(err.message); t.disabled=false; } break; }
    case "renumber": { if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Confirmer la renumérotation"; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent="Renuméroter dans l'ordre chronologique"; } },4000); return; }
      try{ const n=await api.renumber(); await reload(); toast(n?`${n} session(s) renumérotée(s) : S01, S02… suivent désormais l'ordre jour → heure → salle.`:"La numérotation suit déjà l'ordre chronologique."); }catch(err){ toast(err.message); } break; }
    case "bulk": { const st=$("#bulk-st").value; if(!st){ toast("Choisissez un statut."); return; } const ids=[...S.sel]; let ok=0, ko=[];
      if(st==="publie"){ const r=await api.publishMany(ids); ok=r.filter(x=>x.ok).length; ko=r.filter(x=>!x.ok); }
      else for(const id of ids){ try{ await api.setStatus(id,st); ok++; }catch(err){ ko.push({id,error:err.message}); } }
      S.sel.clear(); await reload(); toast(`${ok} session(s) mises à jour${ko.length?` · ${ko.length} refusée(s) : ${ko[0].error}`:""}.`,ko.length?9000:0); break; }
    /* configuration */
    case "savecfg": await saveConfig(); break;
    case "seed": try{ await api.seedDemo(); await reload(); toast("Données de démonstration chargées."); }catch(err){ toast(err.message); } break;
    case "clear": { if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Confirmer : tout supprimer"; setTimeout(()=>{ if(t.isConnected){ delete t.dataset.armed; t.textContent="Vider le programme…"; } },5000); return; }
      try{ await api.clearProgramme(); await reload(); toast("Programme vidé."); }catch(err){ toast(err.message); } break; }
  }
});

async function saveConfig(){

  c.name=g("cf-name").value; c.short=g("cf-short").value; c.venue=g("cf-venue").value; c.city=g("cf-city").value; c.dayStart=g("cf-ds").value; c.dayEnd=g("cf-de").value;
  const moves={}; c.days.forEach((d,i)=>{ const nv=g("cf-d"+i).value; if(nv&&nv!==d.date){ moves[d.date]=nv; d.date=nv; } });
  c.rooms.forEach((r,i)=>r.name=g("cf-r"+i).value||r.name);
  c.blocks.forEach((b,i)=>{ b.day=g("cb-day"+i).value; b.from=g("cb-from"+i).value; b.to=g("cb-to"+i).value; b.label=g("cb-lbl"+i).value; b.rooms=$$(`[data-blk="${i}"]:checked`).map(x=>x.value); if(moves[b.day]) b.day=moves[b.day]; });
  c.template.forEach((t,i)=>{ t.start=g("ct-s"+i).value; t.end=g("ct-e"+i).value; t.kind=g("ct-k"+i).value; t.label=g("ct-l"+i).value; });
  c.themes=g("cf-themes").value.split("\n").map(x=>x.trim()).filter(Boolean);
  try{ await api.saveCongress(c);
    const toMove=sessionsAll().filter(s=>moves[s.day]); for(const s of toMove){ const n=Object.assign(clone(s),{day:moves[s.day]}); await api.saveSession(n,s.version); }
    await reload(); toast("Configuration enregistrée"+(toMove.length?` · ${toMove.length} activité(s) déplacée(s) vers la nouvelle date`:"")+"."); }catch(err){ toast(err.message); }
}
