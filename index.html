@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0c1620;--card:#14212d;--ink:#e2ecf4;--muted:#96a8b8;--line:#26384a;--accent:#5db6ec;--accent-ink:#06243a;--accent-soft:#163049;--focus:#8ab4f8;
  --banner:#0b6aa4;--banner-deep:#084f7b;--danger:#f2b8b5;--danger-soft:#3b1a18;--ok:#8fd6a3;--ok-soft:#173222;--oral:#cfb5f2;--oral-soft:#2c2140;
  --wait:#f1c66b;--wait-soft:#3a2d10;--rev:#7fd3dc;--rev-soft:#123338;--grid:#1d2c3a;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0c1620;--card:#14212d;--ink:#e2ecf4;--muted:#96a8b8;--line:#26384a;--accent:#5db6ec;--accent-ink:#06243a;--accent-soft:#163049;--focus:#8ab4f8;
  --banner:#0b6aa4;--banner-deep:#084f7b;--danger:#f2b8b5;--danger-soft:#3b1a18;--ok:#8fd6a3;--ok-soft:#173222;--oral:#cfb5f2;--oral-soft:#2c2140;
  --wait:#f1c66b;--wait-soft:#3a2d10;--rev:#7fd3dc;--rev-soft:#123338;--grid:#1d2c3a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-family:var(--f-display);font-weight:600;font-size:16px}
.mark{width:30px;height:30px;background:var(--fap);-webkit-mask:var(--logo-mark) center/contain no-repeat;mask:var(--logo-mark) center/contain no-repeat;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:16px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
.pill.demo{background:var(--wait-soft);color:var(--wait)}
.pill.open{background:var(--ok-soft);color:var(--ok)}
.pill.closed{background:var(--danger-soft);color:var(--danger)}

.wrap{max-width:770px;margin:16px auto 0;display:flex;flex-direction:column;gap:12px}
.wrap.wide{max-width:1200px}

.banner{border-radius:8px;overflow:hidden;background:linear-gradient(120deg,var(--banner),var(--banner-deep));color:#fff;position:relative;
  padding:22px 24px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.banner .logo{width:min(210px,46%);height:auto;flex:none}
.banner .txt{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.banner .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.88;font-weight:500}
.banner h1{font-size:clamp(20px,4vw,28px);font-weight:700;line-height:1.15}
.banner .theme{font-style:italic;opacity:.95}
.banner .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;opacity:.92}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px 24px;min-width:0}
.card.head{border-top:10px solid var(--fap);padding-top:20px}
.card.head h2{font-size:26px;font-weight:600;margin-bottom:8px}
.card.head p{margin:0 0 8px}
.req-note{color:var(--danger);font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.q:focus-within{box-shadow:inset 6px 0 0 var(--focus)}
.q.err{border-color:var(--danger)}
.q.err:focus-within{box-shadow:inset 6px 0 0 var(--danger)}
.q-label{font-size:16px;font-weight:500;display:block;margin-bottom:4px}
.star{color:var(--danger)}
.q-help{color:var(--muted);font-size:13px;margin:0 0 12px}
.q-err{color:var(--danger);font-size:13px;margin-top:10px}
.line-input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;outline:none}
.line-input:focus{border-bottom:2px solid var(--accent);padding-bottom:7px}
.line-input.half{max-width:min(100%,360px)}
textarea.line-input{resize:vertical;min-height:84px;line-height:1.55}
.box{border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:var(--card);max-width:100%}
.box-input{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--card);resize:vertical}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:2px 0 0;flex:none}
.opt .other{flex:1;min-width:0}
.section-tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.section-head{background:var(--fap);color:#fff;border-radius:8px 8px 0 0;padding:8px 24px;font-size:13px;font-weight:500;margin-bottom:-12px;align-self:flex-start}
.card.sec{border-top-left-radius:0}
.card.sec h2{font-size:21px;font-weight:600;margin-bottom:6px}
.card.sec p{margin:0;color:var(--muted)}
.counter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:3;align-self:flex-end;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.counter.over{color:var(--danger);border-color:var(--danger)}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.progress{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fap);transition:width .3s}

.btn{border:0;border-radius:4px;padding:10px 22px;font-weight:500;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.btn.text{background:none;color:var(--accent);padding:10px 12px}
.btn.danger{background:var(--danger);color:var(--card)}
.btn.sm{padding:6px 14px;font-size:13px}
.notice{border-radius:8px;padding:12px 16px;font-size:14px}
.notice.info{background:var(--accent-soft)}
.notice.warn{background:var(--wait-soft);color:var(--wait)}
.notice.bad{background:var(--danger-soft);color:var(--danger)}
.ref{font-family:var(--f-mono);font-size:22px;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:8px 14px;border-radius:6px;display:inline-block}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-en_attente{background:var(--wait-soft);color:var(--wait)}
.s-revision{background:var(--rev-soft);color:var(--rev)}
.s-orale{background:var(--oral-soft);color:var(--oral)}
.s-poster{background:var(--ok-soft);color:var(--ok)}
.s-refuse{background:var(--danger-soft);color:var(--danger)}

/* admin shell */
.ahead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.atabs{border-bottom:1px solid var(--line)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:var(--card)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--accent-soft)}
td.cb,th.cb{width:36px;padding-right:0}
td.cb input,th.cb input{accent-color:var(--accent);width:17px;height:17px}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.t-title{font-weight:500;max-width:440px}
.small{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.selbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:4;background:var(--ink);color:var(--ground);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.selbar .btn{background:var(--ground);color:var(--ink)}

/* dashboard */
.dash-hero{border-radius:10px;overflow:hidden;background:linear-gradient(120deg,var(--banner),var(--banner-deep));color:#fff;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:22px 24px;align-items:center}
@media (max-width:760px){.dash-hero{grid-template-columns:1fr}}
.dash-hero .logo{width:180px;max-width:60%}
.dash-hero h2{font-size:clamp(20px,3vw,26px);margin:10px 0 4px}
.dash-hero .theme{font-style:italic;opacity:.95;margin:0 0 12px}
.countdowns{display:flex;gap:10px;flex-wrap:wrap}
.cd{background:rgba(255,255,255,.14);border-radius:8px;padding:8px 14px;min-width:120px}
.cd b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{font-size:12px;opacity:.9}
.hero-art{width:100%;max-width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.kpi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.kpi .ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kpi b{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.ic.k-all{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.panel h3{font-size:16px;font-weight:600;margin-bottom:2px}
.panel .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{width:170px;height:170px;flex:none}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:160px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.hb{display:flex;flex-direction:column;gap:10px}
.hb-row{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
@media (max-width:560px){.hb-row{grid-template-columns:minmax(0,1fr) 30px}.hb-row .lbl{grid-column:1/-1}}
.hb-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:14px;background:var(--grid);border-radius:4px;display:flex;overflow:hidden}
.hb-track i{display:block;height:100%}
.hb-row b{text-align:right;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.heat{display:grid;grid-template-columns:minmax(0,130px) repeat(5,minmax(0,1fr));gap:4px;font-size:12.5px}
.heat .h{color:var(--muted);text-align:center;font-size:11.5px;align-self:end}
.heat .r{color:var(--muted);align-self:center}
.heat .c{border-radius:6px;padding:10px 0;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13.5px}
.feed div:last-child{border-bottom:0}
.feed .t{flex:1;min-width:0}
.feed .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* mail & templates */
.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.listbox{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.listbox h4{margin:0;padding:10px 16px 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.li{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.li[aria-current="true"]{background:var(--accent-soft)}
.li .who{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.li.unread .who::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.li .subj{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.var{border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 8px;font-family:var(--f-mono);font-size:12px;cursor:pointer}
.mailprev{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.mailprev .mh{background:var(--banner);color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:center}
.mailprev .mh img{width:120px;height:auto;flex:none}
.mailprev .mh div{font-size:12px;opacity:.9}
.mailprev .ms{padding:10px 20px;border-bottom:1px solid var(--line);font-size:13.5px}
.mailprev .mb{padding:16px 20px;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.mailprev .mb p{margin:0 0 10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13.5px;cursor:pointer;background:var(--card)}
.seg input{accent-color:var(--accent)}
.statusbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:600px){.statusbox{grid-template-columns:1fr}}
.statusbox label{border:1.5px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--card)}
.statusbox label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.statusbox input{accent-color:var(--accent);margin-top:3px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(740px,100%);height:100%;overflow-y:auto;background:var(--ground);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 16px;display:flex;flex-direction:column;gap:12px}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.dl{grid-template-columns:1fr}.dl dd{margin-bottom:6px}}
.abs h4{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:14px 0 4px}
.abs p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.decide{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:620px){.decide{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dbtn{border:1.5px solid var(--line);border-radius:8px;padding:10px 6px;cursor:pointer;font-weight:500;font-size:13px}
.dbtn:not([aria-pressed="true"]){background:var(--card);color:var(--ink)}
.dbtn[aria-pressed="true"]{border-color:currentColor}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:6px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
@media (max-width:520px){.card{padding:18px 16px}.banner,.dash-hero{padding:18px 16px}.section-head{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}

/* ================== UTILITIES ================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words=s=>(String(s||"").trim().match(/\S+/g)||[]).length;
const ABS_FIELDS=["introduction","methodes","resultats","conclusion"];
const totalWords=o=>ABS_FIELDS.reduce((n,k)=>n+words(o[k]),0);
const fmtDate=iso=>{ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); };
const fmtDay=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const deadlineLabel=c=>{ const d=new Date(c.deadline); return isNaN(d)?c.deadline:d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":","h"); };

async function remote(fn,...args){
  let r;
  try{ r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fn,args}),redirect:"follow"}); }
  catch(e){ throw new Error("Connexion au serveur impossible. Vérifiez votre connexion Internet et réessayez."); }
  if(!r.ok) throw new Error("Le serveur ne répond pas (erreur "+r.status+"). Réessayez dans quelques instants.");
  let j; try{ j=await r.json(); }catch(e){ throw new Error("Réponse du serveur illisible. Vérifiez la configuration du serveur Vercel (variables d'environnement)."); }
  if(!j.ok) throw new Error(j.error||"Erreur serveur.");
  return j.data;
}

function donut(rows){
  const tot=rows.reduce((s,r)=>s+r.v,0)||1; let acc=0; const R=60,C=2*Math.PI*R;
  const segs=rows.filter(r=>r.v>0).map(r=>{ const len=r.v/tot*C; const s=`<circle cx="85" cy="85" r="${R}" fill="none" stroke="${r.c}" stroke-width="26" stroke-dasharray="${len-1.5} ${C-len+1.5}" stroke-dashoffset="${-acc}" transform="rotate(-90 85 85)"><title>${esc(r.l)} : ${r.v}</title></circle>`; acc+=len; return s; }).join("");
  return `<svg viewBox="0 0 170 170" role="img" aria-label="Répartition des décisions"><circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--grid)" stroke-width="26"/>${segs}
    <text x="85" y="82" text-anchor="middle" font-family="Outfit,sans-serif" font-size="30" font-weight="600" fill="var(--ink)">${rows.reduce((s,r)=>s+r.v,0)}</text><text x="85" y="102" text-anchor="middle" font-size="11" fill="var(--muted)">résumés</text></svg>`;
}
function lineChart(A){
  if(!A.length) return `<div class="empty">Le graphique apparaîtra avec les premières soumissions.</div>`;
  const day=d=>{ const x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
  const first=day(A.reduce((m,a)=>a.date<m?a.date:m,A[0].date)), dl=day(CFG.deadline), last=Math.max(day(Date.now()),first+864e5*7);
  const end=Math.max(last,Math.min(dl,first+120*864e5)); const N=Math.round((end-first)/864e5)+1;
  const per=new Array(N).fill(0); A.forEach(a=>{ const i=Math.round((day(a.date)-first)/864e5); if(i>=0&&i<N) per[i]++; });
  const today=Math.min(N-1,Math.round((day(Date.now())-first)/864e5)); let cum=0; const cu=per.map((v,i)=>i<=today?(cum+=v):null);
  const W=640,H=230,L=36,Rr=12,T=14,B=30,maxY=Math.max(5,Math.ceil(cum/5)*5), maxBar=Math.max(1,...per);
  const x=i=>L+(N===1?0:i/(N-1))*(W-L-Rr), y=v=>T+(1-v/maxY)*(H-T-B);
  const pts=cu.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`;
  const bw=Math.max(2,(W-L-Rr)/N*0.6);
  const bars=per.map((v,i)=>v&&i<=today?`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(y(0)-v/maxBar*(H-T-B)*0.35).toFixed(1)}" width="${bw.toFixed(1)}" height="${(v/maxBar*(H-T-B)*0.35).toFixed(1)}" fill="var(--fap)" opacity=".28"><title>${v} le ${fmtDay(new Date(first+i*864e5))}</title></rect>`:"").join("");
  const yt=[0,.25,.5,.75,1].map(f=>Math.round(maxY*f));
  const step=Math.max(1,Math.ceil(N/6)); const xt=[]; for(let i=0;i<N;i+=step) xt.push(i);
  const dlI=Math.round((dl-first)/864e5);
  const dlMark=dlI>=0&&dlI<N?`<line x1="${x(dlI)}" x2="${x(dlI)}" y1="${T}" y2="${y(0)}" stroke="var(--danger)" stroke-dasharray="4 4"/><text x="${x(dlI)-4}" y="${T+10}" text-anchor="end" font-size="11" fill="var(--danger)">Date limite</text>`:"";
  const lp=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Soumissions cumulées">
   ${yt.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("")}
   ${xt.map(i=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtDay(new Date(first+i*864e5))}</text>`).join("")}
   ${bars}<path d="${area}" fill="var(--fap)" opacity=".14"/><path d="${path}" fill="none" stroke="var(--fap)" stroke-width="2.5"/>
   <circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="var(--fap)" stroke="var(--card)" stroke-width="2"/><text x="${Math.min(lp[0],W-60)}" y="${lp[1]-10}" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">${cum}</text>${dlMark}</svg>`;
}
function hbars(rows,stack){
  const max=Math.max(1,...rows.map(r=>r.total));
  return `<div class="hb">${rows.map(r=>`<div class="hb-row"><span class="lbl" title="${esc(r.l)}">${esc(r.l)}</span><div class="hb-track" style="width:${Math.max(4,r.total/max*100)}%">${
    stack?Object.keys(STATUS).map(k=>r[k]?`<i style="width:${r[k]/r.total*100}%;background:${STATUS[k].color}" title="${STATUS[k].short} : ${r[k]}"></i>`:"").join(""):`<i style="width:100%;background:var(--fap)"></i>`}</div><b>${r.total}</b></div>`).join("")}</div>`;
}

  const modes=["Communication orale","Poster","Indifférent"], decs=Object.keys(STATUS);

  return `<section class="dash-hero"><div><img class="logo" src="${LOGO_FULL}" alt="FAP"><h2>${esc(CFG.edition)}</h2>
      ${CFG.themeGeneral?`<p class="theme">« ${esc(CFG.themeGeneral)} »</p>`:`<p class="theme" style="opacity:.75">Thème général à définir dans Paramètres</p>`}
      <div class="countdowns"><div class="cd"><b>${open?Math.max(0,dDl):"Closes"}</b><span>${open?"jours avant la date limite":"soumissions"}</span></div>
      ${dCg!=null?`<div class="cd"><b>J−${Math.max(0,dCg)}</b><span>avant le congrès</span></div>`:""}<div class="cd"><b>${rate}%</b><span>taux d'acceptation</span></div></div></div>${heroArt()}</section>
    <div class="kpis">${kp.map(([k,l,v])=>`<button class="kpi" data-goto="${k}"><span class="ic" style="background:${icBg(k)};color:${icFg(k)}">${ICONS[k]}</span><b>${v}</b><span>${l}</span></button>`).join("")}</div>
    <div class="grid3"><div class="card panel chart"><h3>Évolution des soumissions</h3><p class="sub">Cumul quotidien (ligne) et nouvelles soumissions par jour (barres)</p>${lineChart(A)}</div>
      <div class="card panel"><h3>Décisions du comité</h3><p class="sub">Répartition de tous les résumés reçus</p><div class="donut-wrap">${donut(decs.map(k=>({l:STATUS[k].short,v:c[k],c:STATUS[k].color})))}
        <div class="legend">${decs.map(k=>`<div><i style="background:${STATUS[k].color}"></i>${STATUS[k].label}<b>${c[k]}</b></div>`).join("")}</div></div></div></div>
    <div class="card panel"><h3>Résumés par thématique</h3><p class="sub">Couleur = décision · ${Object.keys(STATUS).map(k=>`<span style="color:${STATUS[k].color}">■</span> ${STATUS[k].short}`).join(" · ")}</p>${A.length?hbars(byTheme,true):`<div class="empty">Aucune donnée.</div>`}</div>
    <div class="grid2"><div class="card panel"><h3>Profil des auteurs</h3><p class="sub">Statut professionnel de l'auteur correspondant</p>${A.length?hbars(tally("statut_pro")):`<div class="empty">Aucune donnée.</div>`}</div>
      <div class="card panel"><h3>Origine géographique</h3><p class="sub">Les 8 wilayas les plus représentées</p>${A.length?hbars(tally("wilaya")):`<div class="empty">Aucune donnée.</div>`}</div></div>
    <div class="grid2"><div class="card panel"><h3>Souhait de l'auteur et décision</h3><p class="sub">Nombre de résumés par croisement</p>
      <div style="overflow-x:auto"><div class="heat" style="min-width:420px"><span></span>${decs.map(d=>`<span class="h">${STATUS[d].short}</span>`).join("")}
      ${modes.map(m=>`<span class="r">${m==="Communication orale"?"Orale souhaitée":m==="Poster"?"Poster souhaité":"Indifférent"}</span>${decs.map(d=>{ const n=A.filter(a=>a.mode===m&&(a.decision||"en_attente")===d).length; return `<span class="c" style="background:color-mix(in srgb, var(--fap) ${Math.round(n/hmax*85)}%, var(--grid));color:${n/hmax>.5?"#fff":"var(--ink)"}">${n}</span>`; }).join("")}`).join("")}</div></div></div>

/* ================== BINDINGS ================== */
function bind(){
  $$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(S.view==="soumettre") bindForm(); else if(S.view==="suivi") bindSuivi(); else if(S.view==="contact") bindContact(); else S.token?bindAdmin():bindLogin();
}
function bindForm(){
  if(S.submitted){ $("#another").onclick=()=>{S.submitted=null;S.form={};S.step=0;saveDraft();render();}; return; }
  $$("[data-f]").forEach(el=>el.addEventListener("input",()=>{S.form[el.dataset.f]=el.value;clearErr(el.dataset.f);saveDraft();updateWC();}));
  $$("input[type=radio]").forEach(el=>el.addEventListener("change",()=>{ const id=el.name; if(el.value==="__other"){ const t=$(`[data-other="${id}"]`); S.form[id]=otherVal(id,t.value); t.focus(); } else S.form[id]=el.value; clearErr(id); saveDraft(); }));
  $$("[data-other]").forEach(el=>el.addEventListener("input",()=>{ const id=el.dataset.other; $(`#f-${id}-o`).checked=true; S.form[id]=otherVal(id,el.value); clearErr(id); saveDraft(); }));
  $$("[data-check]").forEach(el=>el.addEventListener("change",()=>{ const id=el.dataset.check; S.form[id]=$$(`[data-check="${id}"]:checked`).map(x=>+x.value); clearErr(id); saveDraft(); }));
  $("#next")&&($("#next").onclick=()=>{ if(validate(S.step)){S.step++;render();window.scrollTo(0,0);} });
  $("#prev")&&($("#prev").onclick=()=>{S.step--;S.errors={};render();window.scrollTo(0,0);});
  $("#send")&&($("#send").onclick=submit);
  $("#clear").onclick=()=>{ const b=$("#clear"); if(b.dataset.armed){S.form={};S.errors={};S.step=0;saveDraft();render();} else { b.dataset.armed="1"; b.textContent="Confirmer l'effacement"; setTimeout(()=>{ if(b.isConnected){b.textContent="Effacer le formulaire";delete b.dataset.armed;} },4000); } };
}
const otherVal=(id,t)=>id==="conflits"?(t.trim()?"Oui : "+t.trim():"Oui : "):t;
function clearErr(id){ if(S.errors[id]){ delete S.errors[id]; const c=$("#q-"+id); if(c){c.classList.remove("err");c.querySelector(".q-err")?.remove();} } }
function updateWC(){ const w=$("#wc"); if(!w) return; const n=totalWords(S.form); w.textContent=`${n} / ${CFG.maxWords} mots`; w.classList.toggle("over",n>CFG.maxWords); }
function validate(step){
  const E={},f=S.form,sec=sections()[step];
  for(const q of sec.q){ const v=f[q.id];
    if(q.type==="checks"){ if(!Array.isArray(v)||v.length<q.options.length) E[q.id]="Veuillez cocher tous les engagements pour envoyer votre résumé."; continue; }
    const s=String(v??"").trim();
    if(q.req&&(!s||s==="Oui :")){ E[q.id]=q.id==="conflits"&&s.startsWith("Oui")?"Précisez la nature du conflit d'intérêts.":"Cette question est obligatoire."; continue; }
    if(q.type==="email"&&!validEmail(s)) E[q.id]="Adresse e-mail non valide.";
    if(q.type==="tel"&&s.replace(/\D/g,"").length<9) E[q.id]="Numéro de téléphone non valide.";
    if(q.id==="motscles"){ const n=s.split(/[,;]/).map(x=>x.trim()).filter(Boolean).length; if(n<3||n>5) E[q.id]="Indiquez entre 3 et 5 mots-clés séparés par des virgules."; } }
  if(sec.counter&&totalWords(f)>CFG.maxWords) E.conclusion=`Le résumé compte ${totalWords(f)} mots. Réduisez-le à ${CFG.maxWords} mots maximum.`;
  S.errors=E; if(Object.keys(E).length){ render(); $(".q.err")?.scrollIntoView({behavior:"smooth",block:"center"}); return false; } return true;
}
async function submit(){
  for(let i=0;i<sections().length;i++){ if(!validate(i)){ if(S.step!==i){S.step=i;validate(i);} return; } }
  S.sending=true; render();
  try{ const r=await API.submitAbstract({...S.form,engagements:"Tous acceptés"}); S.submitted={ref:r.ref,email:S.form.email}; S.form={}; S.step=0; saveDraft(); }
  catch(e){ toast(e.message||"L'envoi a échoué. Vérifiez votre connexion et réessayez."); }
  S.sending=false; render(); window.scrollTo(0,0);
}
function bindSuivi(){ $("#s-go").onclick=async()=>{ S.sRef=$("#s-ref").value; S.sEmail=$("#s-email").value; const out=$("#s-out");
  if(!S.sRef.trim()||!S.sEmail.trim()){ out.innerHTML=`<div class="notice bad">Renseignez la référence et l'adresse e-mail.</div>`; return; }
  out.innerHTML=`<div class="notice info">Recherche…</div>`;
  try{ const r=await API.getStatus(S.sRef,S.sEmail),st=STATUS[r.decision]||STATUS.en_attente;
    out.innerHTML=`<div class="card"><div class="row"><span class="mono">${esc(r.ref)}</span>${chip(r.decision)}</div><h3 style="font-size:18px;margin:10px 0 6px">${esc(r.titre)}</h3><p style="margin:0">${esc(st.author)}</p>
    ${r.commentaire?`<div class="notice info" style="margin-top:12px"><b>Message du comité</b><br>${esc(r.commentaire)}</div>`:""}<p class="small" style="margin:10px 0 0">Soumis le ${esc(fmtDate(r.date))}</p></div>`;
  }catch(e){ out.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`; } }; }
function bindContact(){
  const read=()=>({nom:$("#c-nom").value,email:$("#c-email").value,objet:$("#c-objet").value,ref:$("#c-ref").value,message:$("#c-msg").value});
  ["c-nom","c-email","c-objet","c-ref","c-msg"].forEach(id=>$("#"+id).addEventListener("input",()=>{S.contact=read();}));
  $("#c-send").onclick=async()=>{ const c=read(),err=$("#c-err");
    if(!c.nom.trim()||!c.objet||!c.message.trim()){ err.innerHTML=`<div class="notice bad">Renseignez votre nom, l'objet et votre message.</div>`; return; }
    if(!validEmail(c.email)){ err.innerHTML=`<div class="notice bad">Adresse e-mail non valide.</div>`; return; }
    $("#c-send").disabled=true;
    try{ await API.sendContact(c); S.contact={}; $("#app").innerHTML=`<div class="wrap">${banner("Contacter le comité scientifique")}<div class="card head"><h2>Message envoyé</h2><p>Le comité scientifique vous répondra à l'adresse ${esc(c.email)}.</p><div class="row" style="margin-top:12px"><button class="btn ghost" data-go="contact">Écrire un autre message</button></div></div></div>`; bind(); }
    catch(e){ err.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`; $("#c-send").disabled=false; } };
}
function bindLogin(){ const f=async()=>{ try{ S.token=await API.adminLogin($("#a-pw").value); await loadAdmin(); }catch(e){ $("#a-err").innerHTML=`<div class="notice bad">${esc(e.message)}</div>`; } };
  $("#a-go").onclick=f; $("#a-pw").addEventListener("keydown",e=>{ if(e.key==="Enter") f(); }); }
async function loadAdmin(){
  try{ S.data=await API.adminData(S.token); if(S.data.settings) mergeCfg(S.data.settings); else await API.adminSaveSettings(S.token,CFG); render(); }
  catch(e){ S.token=null; render(); toast(e.message); }

function exportCSV(){
  const cols=[["ref","Référence"],["date","Date de soumission"],["decision","Statut"],["nom","Nom"],["prenom","Prénom"],["email","E-mail"],["tel","Téléphone"],["statut_pro","Statut professionnel"],["etablissement","Établissement"],["wilaya","Wilaya"],["titre","Titre"],["type_travail","Nature du travail"],["thematique","Thématique"],["mode","Présentation souhaitée"],["auteurs","Auteurs"],["affiliations","Affiliations"],["introduction","Introduction"],["methodes","Matériel et méthodes"],["resultats","Résultats"],["conclusion","Conclusion"],["motscles","Mots-clés"],["conflits","Conflits d'intérêts"],["commentaire","Message à l'auteur"],["note_interne","Note interne"],["date_decision","Date de décision"],["notifie","Auteur notifié"]];
  const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[cols.map(c=>cell(c[1])).join(";")].concat([...S.data.abstracts].sort((a,b)=>a.ref.localeCompare(b.ref)).map(a=>cols.map(([k])=>cell(k==="decision"?(STATUS[a[k]]||STATUS.en_attente).label:a[k])).join(";")));
  const blob=new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(blob), l=document.createElement("a"); l.href=u; l.download="resumes-congres-fap-"+new Date().toISOString().slice(0,10)+".csv"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast(S.data.abstracts.length+" résumés exportés.");
}
const EDIT_FIELDS=[["titre","Titre","text"],["auteurs","Auteurs","area",2],["affiliations","Affiliations","area",2],["thematique","Thématique","sel"],["type_travail","Nature du travail","sel"],["mode","Présentation souhaitée","sel"],
  ["introduction","Introduction et objectif","area",4],["methodes","Matériel et méthodes","area",5],["resultats","Résultats","area",6],["conclusion","Conclusion","area",4],["motscles","Mots-clés","text"],
  ["nom","Nom","text"],["prenom","Prénom","text"],["email","E-mail","text"],["tel","Téléphone","text"],["statut_pro","Statut professionnel","text"],["etablissement","Établissement","text"],["wilaya","Wilaya","sel"],["conflits","Conflits d'intérêts","text"]];
function editOptions(k){ return k==="thematique"?CFG.themes:k==="type_travail"?["Travail original","Cas clinique","Revue de la littérature / mise au point"]:k==="mode"?["Communication orale","Poster","Indifférent"]:k==="wilaya"?WILAYAS:[]; }
function editHTML(a){
  return `<div class="scrim" id="scrim"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Modifier ${esc(a.ref)}">
    <div class="row"><span class="mono">${esc(a.ref)}</span><b>Modification du résumé</b><span class="spacer"></span><button class="btn ghost sm" id="e-cancel">Annuler</button></div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
    ${EDIT_FIELDS.map(([k,l,t,r])=>{ const v=a[k]??""; const id="e-"+k;
      if(t==="area") return `<div class="field"><label for="${id}">${l}</label><textarea class="box-input" id="${id}" data-e="${k}" rows="${r}">${esc(v)}</textarea></div>`;
      if(t==="sel"){ const o=editOptions(k); const opts=(o.includes(v)?o:[v,...o]); return `<div class="field"><label for="${id}">${l}</label><select class="box" id="${id}" data-e="${k}">${opts.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select></div>`; }
      return `<div class="field"><label for="${id}">${l}</label><input class="box" id="${id}" data-e="${k}" value="${esc(v)}"></div>`; }).join("")}
    <p class="small mono" id="e-wc" style="margin:0"></p>
    <div id="e-err"></div>
    <div class="row"><button class="btn" id="e-save">Enregistrer les modifications</button><button class="btn ghost" id="e-cancel2">Annuler</button></div></div></aside></div>`;
}
function openEdit(a){
  $("#layer").innerHTML=editHTML(a);
  const read=()=>{ const o={}; $$("[data-e]").forEach(el=>o[el.dataset.e]=el.value); return o; };
  const wc=()=>{ const n=totalWords(read()); const e=$("#e-wc"); e.textContent=`Résumé : ${n} / ${CFG.maxWords} mots`; e.style.color=n>CFG.maxWords?"var(--danger)":""; };
  wc(); ABS_FIELDS.forEach(k=>$("#e-"+k).addEventListener("input",wc));
  const back=()=>openDrawer(a.ref);
  $("#e-cancel").onclick=back; $("#e-cancel2").onclick=back; $("#scrim").onclick=e=>{ if(e.target.id==="scrim") back(); };
  $("#e-save").onclick=async()=>{ const o=read(),err=$("#e-err"),b=$("#e-save");
    const empty=EDIT_FIELDS.find(([k])=>!String(o[k]||"").trim()); if(empty){ err.innerHTML=`<div class="notice bad">Le champ « ${esc(empty[1])} » est vide.</div>`; return; }
    if(!validEmail(o.email)){ err.innerHTML=`<div class="notice bad">Adresse e-mail non valide.</div>`; return; }
    b.disabled=true; b.textContent="Enregistrement…";
    try{ const upd=await API.adminUpdateAbstract(S.token,a.ref,o); Object.assign(a,upd); render(); openDrawer(a.ref); toast(`${a.ref} modifié.`); }
    catch(e){ err.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`; b.disabled=false; b.textContent="Enregistrer les modifications"; } };
}
function openDrawer(ref){ const a=S.data.abstracts.find(x=>x.ref===ref); if(!a) return; $("#layer").innerHTML=drawerHTML(a); bindDrawer(a); $("#d-close").focus(); }
function closeDrawer(){ $("#layer").innerHTML=""; document.removeEventListener("keydown",onEsc); }
function onEsc(e){ if(e.key==="Escape") closeDrawer(); }
function bindDrawer(a){
  let showPrev=false;
  const dec=()=>($(".dbtn[aria-pressed='true']")||{dataset:{dec:"en_attente"}}).dataset.dec;
  const refresh=()=>{ const d=dec(),t=CFG.templates.find(x=>x.trigger===d),nb=$("#d-notify"),lab=$("#d-notify-l");
    if(d==="en_attente"||!t){ nb.disabled=true; nb.checked=false; lab.textContent="Aucun e-mail pour le statut « En évaluation »"; $("#d-prev").innerHTML=""; $("#d-toggle").hidden=true; return; }
    nb.disabled=false; $("#d-toggle").hidden=false; lab.innerHTML=`Envoyer l'e-mail « ${esc(t.name)} » à ${esc(a.email)}`;
    const tmp={...a,decision:d,commentaire:$("#d-com").value};
    $("#d-prev").innerHTML=showPrev?mailPreview(fillTpl(t.subject,tmp,CFG),fillTpl(t.body,tmp,CFG),CFG,a.email):""; $("#d-toggle").textContent=showPrev?"Masquer l'e-mail":"Voir l'e-mail"; };
  $("#scrim").onclick=e=>{ if(e.target.id==="scrim") closeDrawer(); }; $("#d-close").onclick=closeDrawer; document.addEventListener("keydown",onEsc);
  $$("[data-dec]").forEach(b=>b.onclick=()=>{ $$("[data-dec]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); refresh(); });
  $("#d-com").addEventListener("input",()=>{ if(showPrev) refresh(); });
  $("#d-toggle").onclick=()=>{ showPrev=!showPrev; refresh(); };
  $("#d-mail").onclick=()=>{ closeDrawer(); S.comp=newComp([a.ref]); S.atab="com"; render(); };
  $("#d-edit").onclick=()=>openEdit(a);
  $("#d-del").onclick=()=>{ const z=$("#d-delzone");
    z.innerHTML=`<div class="notice bad"><b>Supprimer définitivement ${esc(a.ref)} ?</b><br>« ${esc(a.titre)} »<div class="row" style="margin-top:10px"><button class="btn danger sm" id="d-delok">Oui, supprimer</button><button class="btn ghost sm" id="d-delno">Annuler</button></div></div>`;
    $("#d-delno").onclick=()=>{ closeDrawer(); openDrawer(a.ref); };
    $("#d-delok").onclick=async()=>{ const b=$("#d-delok"); b.disabled=true; b.textContent="Suppression…";
      try{ await API.adminDeleteAbstract(S.token,a.ref); S.data.abstracts=S.data.abstracts.filter(x=>x.ref!==a.ref); S.sel.delete(a.ref); closeDrawer(); render(); toast(`${a.ref} supprimé.`); }
      catch(e){ toast(e.message); b.disabled=false; b.textContent="Oui, supprimer"; } }; };
  $("#d-save").onclick=async()=>{ const d=dec(),t=CFG.templates.find(x=>x.trigger===d),send=$("#d-notify").checked&&t,btn=$("#d-save"); btn.disabled=true; btn.textContent="Enregistrement…";
    try{ const upd=await API.adminDecide(S.token,a.ref,d,$("#d-com").value,$("#d-note").value,send?{subject:t.subject,body:t.body,name:t.name}:null); Object.assign(a,upd); closeDrawer(); render();
      toast(upd.mailError?`${a.ref} enregistré, mais l'e-mail n'est pas parti : ${upd.mailError}`:`${a.ref} : ${STATUS[d].label}${send?(LIVE?" · e-mail envoyé":" · e-mail simulé (démo)"):""}`); }
    catch(e){ toast(e.message); btn.disabled=false; btn.textContent="Enregistrer"; } };
  refresh();
}

/* ================== BOOT ================== */
(async()=>{ try{ const c=await API.getPublicConfig(); if(c) mergeCfg(c); }catch(e){} render(); })();
